<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DASC-21 くらしのチェック｜認知機能と生活機能の見立て</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#20437D;
  --teal:#0B3540;
  --blue:#4472C4;
  --orange:#EA5514;
  --amber:#FFC000;
  --paper:#EBEFF4;
  --card:#FFFFFF;
  --line:#C9D4E0;
  --ink:#12212E;
  --mute:#5D7085;
  --ok-bg:#EAF0F9;
  --ng-bg:#FDEFE7;
  --serif:"Zen Old Mincho","Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:17px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 80px}

/* ---------- header ---------- */
.masthead{
  background:var(--teal);
  color:#fff;
  padding:22px 0 20px;
  border-bottom:5px solid var(--amber);
}
.masthead .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{
  font-family:var(--serif);
  font-weight:900;
  font-size:1.5rem;
  letter-spacing:.06em;
  margin:0;
}
.brand .sub{font-size:.82rem;color:#A9C4D2;letter-spacing:.08em}
.masthead p{margin:8px 0 0;font-size:.9rem;color:#C7DAE4}

/* ---------- progress ---------- */
.progress{
  position:sticky;top:0;z-index:20;
  background:rgba(235,239,244,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:10px 0;
  margin-bottom:26px;
}
.progress .wrap{padding-bottom:0}
.pbar{height:7px;background:#D5DEE8;border-radius:99px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--navy);width:0;transition:width .35s ease}
.pmeta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mute);margin-top:7px;letter-spacing:.04em}
.pmeta b{font-family:var(--serif);color:var(--navy);font-size:.95rem}

/* ---------- cards ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:30px 28px;
  margin-bottom:20px;
}
.card h2{
  font-family:var(--serif);font-weight:700;font-size:1.28rem;
  margin:0 0 14px;letter-spacing:.04em;color:var(--teal);
}
.card h3{font-size:1rem;font-weight:700;margin:24px 0 8px;color:var(--navy)}
.lede{color:var(--mute);font-size:.95rem;margin:0 0 22px}

/* ---------- start screen rules ---------- */
.rules{list-style:none;margin:0;padding:0;counter-reset:r}
.rules li{
  counter-increment:r;
  position:relative;
  padding:16px 0 16px 62px;
  border-top:1px solid var(--line);
}
.rules li:last-child{border-bottom:1px solid var(--line)}
.rules li::before{
  content:counter(r);
  position:absolute;left:0;top:15px;
  font-family:var(--serif);font-weight:700;font-size:1.5rem;
  color:var(--amber);
  width:42px;text-align:center;
  line-height:1.2;
}
.rules b{display:block;font-size:1.02rem;color:var(--teal)}
.rules span{display:block;font-size:.9rem;color:var(--mute);margin-top:3px}

/* ---------- form ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
label.f{display:block;font-size:.82rem;font-weight:700;color:var(--mute);letter-spacing:.05em;margin-bottom:5px}
input[type=text],input[type=date],select,textarea{
  width:100%;font-family:var(--sans);font-size:1rem;
  padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  background:#FBFCFD;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(68,114,196,.35);border-color:var(--blue)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:120px;font-family:var(--sans);font-size:.95rem;font-weight:700;
  padding:12px 10px;border:1px solid var(--line);background:#FBFCFD;color:var(--mute);
  border-radius:9px;cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- question ---------- */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.qno{
  font-family:var(--serif);font-weight:900;font-size:1.05rem;
  background:var(--navy);color:#fff;border-radius:8px;
  padding:2px 11px;letter-spacing:.06em;
}
.qdomain{font-size:.78rem;font-weight:700;letter-spacing:.12em;color:var(--mute)}
.qkey{
  font-size:.7rem;font-weight:700;letter-spacing:.1em;
  background:var(--amber);color:#4A3300;border-radius:5px;padding:2px 8px;
}
.qtext{
  font-family:var(--serif);font-weight:700;
  font-size:1.42rem;line-height:1.6;letter-spacing:.02em;
  margin:6px 0 22px;color:var(--teal);
}

/* ---------- options + anchor line (signature) ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin:0}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  font-family:var(--sans);font-size:1.08rem;font-weight:500;
  background:#FBFCFD;border:1.5px solid var(--line);border-radius:11px;
  padding:15px 18px;cursor:pointer;color:var(--ink);
  transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--blue)}
.opt:focus-visible{outline:3px solid rgba(68,114,196,.45);outline-offset:2px}
.opt .num{
  font-family:var(--serif);font-weight:700;font-size:1.15rem;
  width:32px;height:32px;flex:none;border-radius:50%;
  display:grid;place-items:center;
  border:1.5px solid var(--line);color:var(--mute);background:#fff;
}
.opt[data-band="ok"][aria-pressed="true"]{background:var(--ok-bg);border-color:var(--navy)}
.opt[data-band="ok"][aria-pressed="true"] .num{background:var(--navy);border-color:var(--navy);color:#fff}
.opt[data-band="ng"][aria-pressed="true"]{background:var(--ng-bg);border-color:var(--orange)}
.opt[data-band="ng"][aria-pressed="true"] .num{background:var(--orange);border-color:var(--orange);color:#fff}

.anchor{
  display:flex;align-items:center;gap:12px;
  margin:14px 2px 5px;
}
.anchor::before,.anchor::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--orange) 0 7px,transparent 7px 13px)}
.anchor em{
  font-style:normal;font-size:.74rem;font-weight:700;letter-spacing:.14em;
  color:var(--orange);white-space:nowrap;
}

/* ---------- hint panel ---------- */
.hint{
  margin-top:26px;border:1px solid var(--line);border-left:5px solid var(--amber);
  border-radius:10px;background:#FCFAF3;padding:20px 22px;
}
.hint > b{
  display:block;font-family:var(--serif);font-size:.98rem;letter-spacing:.08em;
  color:#7A5A00;margin-bottom:12px;
}
.hint dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px}
.hint dt{
  font-size:.75rem;font-weight:700;letter-spacing:.08em;color:#8A6A20;
  white-space:nowrap;padding-top:3px;
}
.hint dd{margin:0;font-size:.93rem;line-height:1.72;color:#3E3524}
.memo{margin-top:16px}
.memo label.f{color:#8A6A20}
.memo textarea{background:#fff;min-height:60px;resize:vertical}

/* ---------- nav ---------- */
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.btn{
  font-family:var(--sans);font-size:1rem;font-weight:700;letter-spacing:.05em;
  padding:14px 26px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;
}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:#173461}
.btn.ghost{background:transparent;color:var(--mute);border-color:var(--line)}
.btn.ghost:hover{color:var(--navy);border-color:var(--navy)}
.btn.warm{background:var(--orange);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible{outline:3px solid rgba(68,114,196,.45);outline-offset:2px}

/* ---------- review table ---------- */
table.rev{width:100%;border-collapse:collapse;font-size:.9rem}
table.rev th,table.rev td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.rev th{font-size:.74rem;letter-spacing:.08em;color:var(--mute);font-weight:700}
table.rev td.sc{font-family:var(--serif);font-weight:700;text-align:center;width:44px}
td.sc.ng{color:var(--orange)}
td.sc.ok{color:var(--navy)}
table.rev button{
  background:none;border:none;color:var(--blue);font-family:var(--sans);
  font-size:.85rem;cursor:pointer;text-decoration:underline;padding:0;
}
tr.unanswered td{background:#FDF6EC}

/* ---------- result ---------- */
.verdict{
  border-radius:var(--r);padding:28px;margin-bottom:20px;color:#fff;
}
.verdict.normal{background:linear-gradient(135deg,var(--navy),var(--teal))}
.verdict.alert{background:linear-gradient(135deg,#C2450F,var(--orange))}
.verdict .eyebrow{font-size:.76rem;letter-spacing:.18em;opacity:.85;font-weight:700}
.scoreline{display:flex;align-items:flex-end;gap:10px;margin:6px 0 10px}
.scoreline .big{font-family:var(--serif);font-weight:900;font-size:4.2rem;line-height:.95}
.scoreline .of{font-size:1.05rem;opacity:.8;padding-bottom:9px}
.verdict h2{font-family:var(--serif);font-size:1.5rem;margin:0 0 8px;color:#fff;letter-spacing:.04em}
.verdict p{margin:0;font-size:.95rem;opacity:.94;line-height:1.8}
.sev{
  display:inline-block;margin-top:14px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:7px 15px;
  font-size:.92rem;font-weight:700;
}

/* profile chart */
.prof{margin-top:6px}
.prow{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;padding:3px 0}
.prow .plabel{font-size:.82rem;color:var(--mute);text-align:right;line-height:1.35}
.prow .plabel b{display:block;color:var(--ink);font-size:.86rem;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:relative}
.cells i{height:22px;border-radius:4px;background:#EDF1F6;display:block}
.cells i.on-ok{background:var(--navy)}
.cells i.on-ng{background:var(--orange)}
.cells::after{
  content:"";position:absolute;left:calc(50% - 1.5px);top:-4px;bottom:-4px;
  width:3px;border-radius:2px;
  background:repeating-linear-gradient(180deg,var(--orange) 0 5px,transparent 5px 9px);
}
.threshold{
  display:grid;grid-template-columns:130px 1fr;gap:12px;margin-bottom:2px;
}
.threshold .t{
  display:grid;grid-template-columns:1fr 1fr;font-size:.7rem;font-weight:700;
  letter-spacing:.08em;color:var(--mute);
}
.threshold .t span:first-child{text-align:right;padding-right:8px;color:var(--navy)}
.threshold .t span:last-child{padding-left:8px;color:var(--orange)}
.gsep{
  grid-column:1/-1;font-size:.72rem;letter-spacing:.12em;font-weight:700;
  color:var(--navy);border-top:1px solid var(--line);
  margin:12px 0 6px;padding-top:8px;
}
.axis{display:grid;grid-template-columns:130px 1fr;gap:12px;margin-top:8px}
.axis .k{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.7rem;color:var(--mute);text-align:center}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;display:block}

.flags{list-style:none;padding:0;margin:0}
.flags li{
  padding:12px 0 12px 16px;border-left:3px solid var(--orange);
  background:var(--ng-bg);border-radius:0 8px 8px 0;margin-bottom:8px;font-size:.94rem;
}
.flags li b{color:#B03D0C}
.next{list-style:none;padding:0;margin:0}
.next li{padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.next li b{display:block;color:var(--navy);font-family:var(--serif);letter-spacing:.03em}

.note{
  font-size:.82rem;color:var(--mute);line-height:1.8;
  border-top:1px solid var(--line);margin-top:26px;padding-top:18px;
}
.note b{color:var(--teal)}
.disclaimer{
  background:#FFF8E6;border:1px solid var(--amber);border-radius:10px;
  padding:16px 18px;font-size:.88rem;line-height:1.75;margin-bottom:20px;color:#5A4400;
}
.disclaimer b{color:#7A5A00}

/* ---------- 医師に伝えるメモ ---------- */
.tell{
  margin-top:18px;border:1px solid var(--line);border-left:5px solid var(--navy);
  border-radius:10px;background:#F4F7FB;padding:20px 22px;
}
.tell > b{
  display:block;font-family:var(--serif);font-size:.98rem;letter-spacing:.08em;
  color:var(--navy);margin-bottom:8px;
}
.tell .why{font-size:.9rem;color:#33455A;margin:0 0 14px;line-height:1.72}
.tell .fmt{
  font-size:.76rem;letter-spacing:.06em;color:var(--mute);font-weight:700;
  border-top:1px dashed var(--line);padding-top:12px;margin-bottom:8px;
}
.chips{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.chip{
  text-align:left;font-family:var(--sans);font-size:.88rem;line-height:1.6;
  background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:10px 13px 10px 34px;cursor:pointer;color:#33455A;position:relative;
}
.chip::before{
  content:"＋";position:absolute;left:12px;top:10px;
  color:var(--blue);font-weight:700;font-size:.95rem;
}
.chip:hover{border-color:var(--blue);background:#F0F5FD}
.chip:focus-visible{outline:3px solid rgba(68,114,196,.45);outline-offset:2px}
.ngex{
  font-size:.82rem;color:var(--mute);margin:10px 0 0;
  border-top:1px dashed var(--line);padding-top:10px;
}
.ngex b{color:#B03D0C}
.tell textarea{background:#fff;min-height:74px;resize:vertical}
.tell label.f{color:var(--navy)}

.confirm{
  background:#FDEFE7;border:1px solid var(--orange);border-radius:11px;
  padding:16px 18px;margin-top:12px;
}
.confirm b{display:block;font-size:.95rem;color:#B03D0C}

/* ---------- デモ ---------- */
.demo{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.demo button{
  text-align:left;font-family:var(--sans);background:#F4F7FB;
  border:1px solid var(--line);border-radius:11px;padding:14px 16px;cursor:pointer;color:var(--ink);
}
.demo button:hover{border-color:var(--navy);background:#EAF0F9}
.demo button b{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--navy);letter-spacing:.04em}
.demo button span{display:block;font-size:.8rem;color:var(--mute);margin-top:2px}
.demo button em{display:block;font-style:normal;font-size:.82rem;color:#33455A;margin-top:7px;line-height:1.6}
.demobadge{
  background:#FFF8E6;border:1px solid var(--amber);border-radius:9px;
  padding:11px 16px;font-size:.85rem;color:#7A5A00;font-weight:700;margin-bottom:16px;
}
.hidden{display:none !important}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}

@media (max-width:640px){
  .threshold{grid-template-columns:96px 1fr;gap:8px}
  .threshold .t{font-size:.62rem}
  body{font-size:16px}
  .card{padding:22px 18px}
  .qtext{font-size:1.2rem}
  .scoreline .big{font-size:3.2rem}
  .hint dl{grid-template-columns:1fr;gap:2px 0}
  .hint dt{padding-top:9px}
  .prow{grid-template-columns:96px 1fr;gap:8px}
  .axis{grid-template-columns:96px 1fr;gap:8px}
  .prow .plabel{font-size:.72rem}
  .prow .plabel b{font-size:.76rem}
  .nav .btn{padding:13px 18px;font-size:.94rem}
}
@media print{
  body{background:#fff}
  .progress,.actions,.no-print{display:none !important}
  .card,.verdict{break-inside:avoid;border:1px solid #999}
  .verdict{color:#000 !important;background:#fff !important;border:2px solid #000}
  .verdict h2,.verdict .eyebrow,.verdict p{color:#000 !important}
  .sev{background:#eee;color:#000;border-color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="brand">
      <h1>くらしのチェック DASC-21</h1>
      <span class="sub">認知機能 ＋ 生活機能アセスメント</span>
    </div>
    <p>ご本人をよく知るご家族・介護者が答える、5〜10分の見立てシートです。</p>
  </div>
</header>

<div class="progress" id="progress">
  <div class="wrap">
    <div class="pbar"><span id="pfill"></span></div>
    <div class="pmeta"><span id="pstage">はじめに</span><span><b id="pnum">0</b> / 21 問</span></div>
  </div>
</div>

<main class="wrap" id="app"></main>

<script>
(function(){
"use strict";

/* ============================================================
   1. 設問データ（DASC-21：粟田主一／東京都健康長寿医療センター研究所）
   ============================================================ */
var SCALE = {
  intro:["感じない","少し感じる","感じる","とても感じる"],
  freq :["まったくない","ときどきある","頻繁にある","いつもそうだ"],
  able :["問題なくできる","だいたいできる","あまりできない","まったくできない"],
  adl  :["問題なくできる","見守りや声がけを要する","一部介助を要する","全介助を要する"]
};

var INTRO = [
  {id:"A", q:"もの忘れが多いと感じますか", scale:"intro"},
  {id:"B", q:"1年前と比べて、もの忘れが増えたと感じますか", scale:"intro"}
];

var ITEMS = [
{n:1, group:"記憶", domain:"近時記憶", scale:"freq", key:false,
 q:"財布や鍵など、物を置いた場所がわからなくなることがありますか",
 h:{see:"置き忘れそのものより、探している時間の長さと頻度。「誰かに盗られた」と言い出すかどうかも重要な手がかりです。",
    line:"週に1回くらいで、自分で見つけられるなら2。ほぼ毎日で、家族が一緒に探すことになるなら3。",
    trap:"「歳だから誰にでもある」と軽く見てしまいがちです。加齢によるもの忘れは「置いた場所」を忘れる。認知症では「置いたこと自体」を忘れます。",
    solo:"冷蔵庫や引き出しの中に鍵や財布が入っていないか、探し物の話が何度も出てこないかを見ます。"},
 tell:"探し物の頻度と、「盗られた」という訴えの有無。物盗られ妄想が始まっているかどうかを医師は見ます。",
 ex:["半年前から。財布を冷蔵庫に入れていたことがあり、週3〜4回は一緒に探している","3か月前から鍵の置き忘れが増え、8月2日に「嫁が財布を盗った」と言い出した","探し物は週1回程度。自分で見つけられ、どこに置いたかは思い出せる"],
 ng:"よく物をなくす"},
{n:2, group:"記憶", domain:"近時記憶", scale:"freq", key:false,
 q:"5分前に聞いた話を思い出せないことがありますか",
 h:{see:"同じ話や同じ質問を繰り返すか。伝えたはずの予定や約束が抜け落ちるか。",
    line:"たまに聞き返す程度なら2。同じ質問を1日に何度も繰り返し、直前の会話が残らないなら3。",
    trap:"昔話を上手に語るので「しっかりしている」と判断してしまう。遠い記憶は最後まで残るため、判断材料になりません。",
    solo:"話の前半で出た話題を、後半でさりげなく尋ね直してみると分かります。"},
 tell:"同じ質問を繰り返す回数。短期記憶の障害がもっともはっきり現れる場面です。",
 ex:["今年の春から、「今日は何の予定か」を1時間に3〜4回聞いてくる","食事したことを忘れ、30分後に「まだご飯を食べていない」と言う（週2回ほど）","昨年末から、電話で伝えた通院日を毎回忘れ、当日にもう一度説明している"],
 ng:"話を覚えていない"},
{n:3, group:"記憶", domain:"遠隔記憶", scale:"freq", key:true,
 q:"自分の生年月日がわからなくなることがありますか",
 h:{see:"生年月日・出身地・家族の名前といった、人生の土台になる情報が保たれているか。",
    line:"少し考えれば正しく言えるなら2。年号や年が出てこない、間違えるなら3。",

    solo:"日めくりカレンダーが止まっていないか、新聞や郵便物の日付を意識しているかを見ます。"},

var state = {
  screen:"start",          // start | intro | q | review | result
  idx:0,                   // 質問インデックス (0..20)
  answers:{},              // n -> 1..4
  memos:{},                // n -> string
  introAns:{},             // A/B -> 1..4
  demo:null,               // デモ事例名
  confirmReset:false,      // やり直しの確認中フラグ
  meta:{name:"",age:"",sex:"",living:"同居",respondent:"家族・介護者",relation:"",rater:"",date:new Date().toISOString().slice(0,10)}
};

var app = document.getElementById("app");
var pfill = document.getElementById("pfill");
var pnum  = document.getElementById("pnum");
var pstage= document.getElementById("pstage");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function answeredCount(){var c=0;for(var i=1;i<=21;i++){if(state.answers[i])c++;}return c;}

function updateProgress(){
  var c = answeredCount();
  pnum.textContent = c;
  pfill.style.width = (c/21*100)+"%";
  pstage.textContent = ({start:"はじめに",intro:"導入の質問",q:"質問",review:"回答の確認",result:"結果"})[state.screen];
}

function go(screen,idx){
  state.screen = screen;
  if(typeof idx === "number") state.idx = idx;
  render();
  window.scrollTo({top:0,behavior:"instant"});
}

  var html = '<div class="card">'
   +'<div class="qdomain">導入の質問（点数には入りません）</div>'
   +'<h2 style="margin-top:6px">まず、もの忘れの自覚をうかがいます</h2>'
   +'<p class="lede">この2問は点数に含めません。ご本人の受け止め方を知り、本題に入りやすくするための質問です。ここで「感じない」と答えても、21の質問はそのまま進めてください。</p>';
  INTRO.forEach(function(it){
    html += '<div style="margin-bottom:26px">'
      +'<div class="qhead"><span class="qno">'+it.id+'</span></div>'
      +'<div class="qtext" style="font-size:1.2rem;margin-bottom:14px">'+esc(it.q)+'</div>'
      +'<div class="opts">';
    SCALE.intro.forEach(function(lab,i){
      var v=i+1, on = state.introAns[it.id]===v;
      html += '<button class="opt" type="button" data-intro="'+it.id+'" data-v="'+v+'" data-band="ok" aria-pressed="'+on+'">'
        +'<span class="num">'+v+'</span><span>'+esc(lab)+'</span></button>';
    });
    html += '</div></div>';
  });
  html += '<div class="nav"><button class="btn ghost" id="back">もどる</button><button class="btn primary" id="next">21の質問へすすむ</button></div></div>';
  return html;
}

function viewQuestion(){
  var it = ITEMS[state.idx];
  var labels = SCALE[it.scale];
  var cur = state.answers[it.n];
  var html = '<div class="card">'
   +'<div class="qhead">'
     +'<span class="qno">問 '+it.n+'</span>'
     +'<span class="qdomain">'+esc(it.group)+' ／ '+esc(it.domain)+'</span>'
     +(it.key ? '<span class="qkey">重症度の判定に使う項目</span>' : '')
   +'</div>'
   +'<div class="qtext">'+esc(it.q)+'</div>'
   +'<div class="opts">';
  for(var i=0;i<4;i++){
    var v=i+1, band = v<=2 ? "ok":"ng", on = cur===v;
    html += '<button class="opt" type="button" data-ans="'+v+'" data-band="'+band+'" aria-pressed="'+on+'">'
      +'<span class="num">'+v+'</span><span>'+esc(labels[i])+'</span></button>';
    if(v===2) html += '<div class="anchor"><em>ここが境目 ── 下は支えが要る範囲</em></div>';
  }
  html += '</div>'
   +'<div class="hint">'
     +'<b>判断のしかた</b>'
     +'<dl>'
       +'<dt>何を見るか</dt><dd>'+esc(it.h.see)+'</dd>'
       +'<dt>2と3の分かれ目</dt><dd>'+esc(it.h.line)+'</dd>'
       +'<dt>間違えやすい点</dt><dd>'+esc(it.h.trap)+'</dd>'
       +'<dt>一人暮らしなら</dt><dd>'+esc(it.h.solo)+'</dd>'
     +'</dl>'
   +'</div>'
   +'<div class="tell">'
     +'<b>医師に伝えるメモ</b>'
     +'<p class="why">'+esc(it.tell)+'</p>'
     +'<div class="fmt">記入例（タップでそのまま入ります。日付や回数はご本人の状況に書き換えてください）</div>'
     +'<div class="chips">'+ it.ex.map(function(e){
         return '<button class="chip" type="button" data-ex="'+esc(e)+'">'+esc(e)+'</button>';
       }).join("") +'</div>'
     +'<label class="f" for="memo">このかたの場合（任意）</label>'
     +'<textarea id="memo" placeholder="いつから／どのくらいの頻度で／どんな場面で／直近の実例をひとつ">'+esc(state.memos[it.n]||"")+'</textarea>'
     +'<p class="ngex"><b>伝わりにくい書き方：</b>「'+esc(it.ng)+'」だけでは、加齢による変化と区別がつきません。時期・頻度・場面のどれかを必ず添えてください。</p>'
   +'</div>'
   +'<div class="nav">'
     +'<button class="btn ghost" id="back">もどる</button>'
     +'<button class="btn primary" id="next" '+(cur?"":"disabled")+'>'+(state.idx===20?"回答を確認する":"つぎへ")+'</button>'
   +'</div>'
   +'</div>';
  return html;
}

function viewReview(){
  var missing = [];
  var rows = "";
  var lastGroup = "";
  ITEMS.forEach(function(it,i){
    var v = state.answers[it.n];
    if(!v) missing.push(it.n);
    if(it.group !== lastGroup){
      rows += '<tr><td colspan="4" style="padding-top:16px;font-size:.74rem;letter-spacing:.1em;font-weight:700;color:var(--navy);border-bottom:none">'+esc(it.group)+'</td></tr>';
      lastGroup = it.group;
    }
    rows += '<tr'+(v?"":' class="unanswered"')+'>'
      +'<td style="width:40px;color:var(--mute)">'+it.n+'</td>'
      +'<td>'+esc(it.q)+(state.memos[it.n]?'<br><span style="font-size:.8rem;color:var(--mute)">メモ：'+esc(state.memos[it.n])+'</span>':'')+'</td>'
      +'<td class="sc '+(v? (v<=2?"ok":"ng") : "")+'">'+(v?v:"—")+'</td>'
      +'<td style="width:60px"><button type="button" data-edit="'+i+'">直す</button></td>'
      +'</tr>';
  });
  return '<div class="card">'
   +'<h2>回答を確認してください</h2>'
   +'<p class="lede">'+(missing.length? '<b style="color:var(--orange)">'+missing.length+'問が未回答です。</b>すべて答えると結果を出せます。' : '21問すべて答えました。気になるところがあれば「直す」から戻れます。')+'</p>'
   +'<table class="rev"><thead><tr><th></th><th>質問</th><th style="text-align:center">点</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
   +'<div class="nav" style="margin-top:24px">'
     +'<button class="btn ghost" id="back">質問にもどる</button>'
     +'<button class="btn primary" id="calc" '+(missing.length?"disabled":"")+'>結果を見る</button>'
   +'</div></div>';
}

/* ---------- 判定ロジック ---------- */
function judge(){
  var total=0;
  for(var i=1;i<=21;i++) total += state.answers[i]||0;
  var keyVals = KEY_ITEMS.map(function(n){return state.answers[n];});
  var allLow  = keyVals.every(function(v){return v<=2;});
  var allHigh = keyVals.every(function(v){return v>=3;});
  var anyHigh = keyVals.some(function(v){return v>=3;});
  var severity = null;
  if(total>=31){
    if(allHigh) severity="重度";
    else if(anyHigh) severity="中等度";
    else if(allLow) severity="軽度";
  }
  return {total:total, positive: total>=31, severity:severity};
}

function viewResult(){
  var r = judge();
  var html = "";

  if(state.demo){
    html += '<div class="demobadge">これはデモ事例「'+esc(state.demo)+'」の結果です。実在の方の記録ではありません。</div>';
  }
  html += '<div class="verdict '+(r.positive?"alert":"normal")+'">'
    +'<div class="eyebrow">DASC-21 合計点（1〜21項目）</div>'
    +'<div class="scoreline"><span class="big">'+r.total+'</span><span class="of">/ 84点　（31点以上でチェック）</span></div>'
    +'<h2>'+(r.positive ? "認知症の可能性があります" : "現時点では正常の範囲と考えられます")+'</h2>'
    +'<p>'+(r.positive
        ? "31点以上でした。これは「認知症です」という診断ではなく、「専門の医療機関で詳しく調べたほうがよい状態です」という合図です。早い段階で相談するほど、使える手立ては多く残っています。"
        : "31点未満でした。導入の質問で「もの忘れを少し感じる」と答えていた場合でも、21項目の合計が31点未満であれば正常の範囲と判断します。ただし、これは今この時点の見立てです。")
    +'</p>'
    +(r.severity ? '<div class="sev">重症度の目安： '+r.severity+'認知症の可能性</div>' : '')
    +'</div>';

  /* 重症度の説明 */
  if(r.positive){
    html += '<div class="card"><h2>重症度の目安について</h2>'
      +'<p class="lede">合計点が31点以上のとき、遠隔記憶（問3）・場所の見当識（問5）・社会的判断力（問9）・身体的ADL（問16〜21）の9項目の点数で、重さの目安を分けます。</p>'
      +'<ul class="next">'
      +'<li'+(r.severity==="軽度"?' style="background:var(--ok-bg);border-radius:8px;padding-left:14px"':'')+'><b>軽度の可能性</b>9項目が<u>すべて</u>1点または2点のとき。生活の細かい部分から支障が出はじめている段階です。</li>'
      +'<li'+(r.severity==="中等度"?' style="background:var(--ng-bg);border-radius:8px;padding-left:14px"':'')+'><b>中等度の可能性</b>9項目の<u>いずれか</u>が3点または4点のとき。判断や身の回りのことに手助けが要りはじめている段階です。</li>'
      +'<li'+(r.severity==="重度"?' style="background:var(--ng-bg);border-radius:8px;padding-left:14px"':'')+'><b>重度の可能性</b>9項目が<u>すべて</u>3点または4点のとき。日常生活の広い範囲で介助が必要な段階です。</li>'
      +'</ul></div>';
  }

  /* プロファイル */
  var prof = "", lastG = "";
  ITEMS.forEach(function(it){
    if(it.group!==lastG){ prof += '<div class="gsep">'+esc(it.group)+'</div>'; lastG=it.group; }
    var v = state.answers[it.n];
    var cells = "";
    for(var k=1;k<=4;k++){
      cells += '<i class="'+(k===v ? (v<=2?"on-ok":"on-ng") : "")+'"></i>';
    }
    prof += '<div class="prow"><div class="plabel"><b>'+esc(it.domain)+'</b>問'+it.n+(it.key?' ★':'')+'</div><div class="cells">'+cells+'</div></div>';
  });
  html += '<div class="card"><h2>どこに支えが要るか</h2>'
    +'<p class="lede">同じ点数でも、どこが低いかで必要な支援は変わります。オレンジの点線より右に印があるところが、いま手助けが要っている部分です。★は重症度の判定に使う項目です。</p>'
    +'<div class="threshold"><div></div><div class="t"><span>大丈夫な範囲 ▸</span><span>◂ 支えが要る範囲</span></div></div>'
    +'<div class="prof">'+prof+'</div>'
    +'<div class="axis"><div></div><div class="k"><span>1</span><span>2</span><span>3</span><span>4</span></div></div>'
    +'<div class="legend"><span><i style="background:var(--navy)"></i>1〜2点：大丈夫な範囲</span><span><i style="background:var(--orange)"></i>3〜4点：支えが要る範囲</span></div>'
    +'</div>';

  /* 気になった項目 */
  var flagged = ITEMS.filter(function(it){return (state.answers[it.n]||0)>=3;});
  if(flagged.length){
    var lis = flagged.map(function(it){
      var memo = state.memos[it.n];
      return '<li><b>問'+it.n+'　'+esc(it.domain)+'</b>'+esc(it.q)+'（'+state.answers[it.n]+'点）'
        + (memo? '<br><span style="font-size:.86rem;color:var(--mute)">メモ：'+esc(memo)+'</span>':'') +'</li>';
    }).join("");
    html += '<div class="card"><h2>受診のときに伝えたいこと</h2>'
      +'<p class="lede">3点以上がついた'+flagged.length+'項目です。「もの忘れが心配です」と伝えるより、この具体的な場面をそのまま話すほうが、医師には正確に伝わります。</p>'
      +'<ul class="flags">'+lis+'</ul></div>';
  }

  /* 次にすること */
  html += '<div class="card"><h2>次にすること</h2><ul class="next">';
  if(r.positive){
    html += '<li><b>1. かかりつけ医に、この結果を持って相談する</b>いきなり専門病院に行かなくて構いません。ふだん診てもらっている先生に、この画面を印刷して見せるのがいちばん早い道です。紹介状を書いてもらえます。</li>'
      +'<li><b>2. 地域包括支援センターに電話する</b>お住まいの市区町村に必ずある、高齢者の相談窓口です。無料で、本人が行かなくても家族だけで相談できます。「認知症かもしれない」と言えば話が通ります。市区町村名と「地域包括支援センター」で検索すれば連絡先が出ます。</li>'
      +'<li><b>3. 診断がつく前でも、備えは始められます</b>介護保険の申請、お金の管理の見直し、火の元や運転の確認。診断を待たずに動けることのほうが多く、早いほど選べる手立ては多く残ります。</li>';
  }else{
    html += '<li><b>1. この結果を保存しておく</b>大切なのは今日の点数そのものより、これからの変化です。半年後、1年後にもう一度チェックして比べられるよう、印刷して残しておいてください。</li>'
      +'<li><b>2. 3点以上がついた項目があれば、そこだけ気にかける</b>合計が31点未満でも、個別の項目に支障が出ているなら、そこから生活の支えを考えはじめる価値があります。</li>'
      +'<li><b>3. 気になることが続くなら、点数に関わらず相談してよい</b>この評価票は、特に一人暮らしで、ご本人からの情報だけの場合、ごく軽い段階を捉えきれないことが分かっています。「以前と違う」という家族の感覚のほうが正しいことがあります。</li>';
  }
  html += '</ul></div>';

  /* 情報欄と注意 */
  var m = state.meta;
  html += '<div class="card">'
    +'<div class="note" style="border:none;margin:0;padding:0">'
    +'<b>記入情報</b><br>'
    +(m.name?'ご本人：'+esc(m.name)+'　':'')+(m.age?'（'+esc(m.age)+'歳）　':'')
    +'暮らし方：'+esc(m.living)+'　回答者：'+esc(m.respondent)+'　記入日：'+esc(m.date)+'<br>'
    +'導入の質問A：'+(state.introAns.A?SCALE.intro[state.introAns.A-1]:"未回答")
    +'／B：'+(state.introAns.B?SCALE.intro[state.introAns.B-1]:"未回答")+'（採点対象外）'
    +'</div></div>';

  html += '<div class="disclaimer">'
    +'<b>この結果は診断ではありません。</b>DASC-21は認知症を見つけるためのスクリーニングと重症度の目安であって、診断ツールではありません。認知症の確定診断には、専門医による総合的な判断が欠かせません。また本来は開発者による研修を受けた専門職が実施する評価票です。高い点数が出ても出なくても、心配が続くなら医療機関にご相談ください。'
    +'</div>';

  html += '<div class="actions no-print">'
    +'<button class="btn primary" id="print">印刷・PDFで保存</button>'
    +'<button class="btn ghost" id="copy">結果を文章でコピー</button>'
    + (state.confirmReset ? '' : '<button class="btn ghost" id="restart">はじめからやり直す</button>')
    +'</div>'
    + (state.confirmReset
        ? '<div class="confirm no-print"><b>回答をすべて消して、はじめからやり直します。よろしいですか。</b>'
          +'<div class="actions" style="margin-top:12px">'
          +'<button class="btn warm" id="reset-yes">消してやり直す</button>'
          +'<button class="btn ghost" id="reset-no">やめる</button>'
          +'</div></div>'
        : '')
    + '<p class="note no-print" id="tip" style="display:none"></p>';

  return html;
}

/* ============================================================
   4. 描画とイベント
   ============================================================ */
function render(){
  var v = {start:viewStart,intro:viewIntro,q:viewQuestion,review:viewReview,result:viewResult}[state.screen];
  app.innerHTML = v();
  updateProgress();
}

/* --- 委譲イベント：appは使い回すので、登録は一度きり --- */
app.addEventListener("click", function(e){
  var t = e.target;
  var b;

  /* 開始画面：暮らし方／回答者 */
  b = t.closest("#seg-living button[data-v], #seg-resp button[data-v]");
  if(b){
    state.meta[ b.parentNode.id === "seg-living" ? "living" : "respondent" ] = b.dataset.v;
    render(); return;
  }
  if(t.closest("#go-intro")){ go("intro"); return; }

  /* 導入質問 */
  b = t.closest("button[data-intro]");
  if(b){ state.introAns[b.dataset.intro] = Number(b.dataset.v); render(); return; }

  /* デモ事例の読み込み */
  b = t.closest("button[data-persona]");
  if(b){
    var pd = PERSONAS[Number(b.dataset.persona)];
    state.meta.name = pd.meta.name; state.meta.age = pd.meta.age;
    state.meta.living = pd.meta.living; state.meta.respondent = pd.meta.respondent;
    state.introAns = {A:pd.intro.A, B:pd.intro.B};
    state.answers = {}; state.memos = {};
    for(var k=1;k<=21;k++){
      state.answers[k] = pd.ans[String(k)];
      state.memos[k] = pd.memos[String(k)];
    }
    state.demo = pd.title + "・" + pd.sub;
    go("review", 0); return;
  }

  /* 記入例をメモ欄に入れる */
  b = t.closest("button[data-ex]");
  if(b){
    var ta = document.getElementById("memo");
    if(ta){
      var n = ITEMS[state.idx].n;
      var cur = (state.memos[n]||"").trim();
      state.memos[n] = cur ? cur + "／" + b.dataset.ex : b.dataset.ex;
      ta.value = state.memos[n];
      ta.focus();
    }
    return;
  }

  /* 21項目の選択 */
  b = t.closest("button[data-ans]");
  if(b && state.screen === "q"){
    state.answers[ ITEMS[state.idx].n ] = Number(b.dataset.ans);
    render(); return;
  }

  /* 確認画面から個別に戻る */
  b = t.closest("button[data-edit]");
  if(b){ go("q", Number(b.dataset.edit)); return; }

  /* もどる */
  if(t.closest("#back")){
    if(state.screen === "intro") go("start");
    else if(state.screen === "q") { if(state.idx === 0) go("intro"); else go("q", state.idx-1); }
    else if(state.screen === "review") go("q", 20);
    return;
  }

  /* すすむ */
  if(t.closest("#next")){
    if(state.screen === "intro") go("q", 0);
    else if(state.screen === "q"){ if(state.idx === 20) go("review"); else go("q", state.idx+1); }
    return;
  }

  if(t.closest("#calc")){ go("result"); return; }
  if(t.closest("#print")){
    try { window.print(); }
    catch(err){ tip("この画面では印刷を開けませんでした。ファイルをブラウザで直接開いてからお試しください。"); }
    return;
  }
  if(t.closest("#restart")){ state.confirmReset = true; render(); return; }
  if(t.closest("#reset-no")){ state.confirmReset = false; render(); return; }
  if(t.closest("#reset-yes")){
    state.answers = {}; state.memos = {}; state.introAns = {};
    state.demo = null; state.confirmReset = false;
    state.meta = {name:"", age:"", sex:"", living:"同居", respondent:"家族・介護者",
                  relation:"", rater:"", date:new Date().toISOString().slice(0,10)};
    go("start", 0); return;
  }
  if(t.closest("#copy")){ copyResult(); return; }
});

app.addEventListener("input", function(e){
  var el = e.target;
  if(el.id === "m-name") state.meta.name = el.value;
  else if(el.id === "m-age") state.meta.age = el.value;
  else if(el.id === "m-date") state.meta.date = el.value;
  else if(el.id === "memo" && state.screen === "q") state.memos[ ITEMS[state.idx].n ] = el.value;
});

function copyResult(){
  var r = judge();
  var lines = [
    "【DASC-21 くらしのチェック 結果】",
    "記入日：" + state.meta.date + (state.meta.name ? "／ご本人：" + state.meta.name : ""),
    "暮らし方：" + state.meta.living + "／回答者：" + state.meta.respondent,
    "",
    "合計 " + r.total + " / 84点　→　" + (r.positive ? "認知症の可能性あり（31点以上）" : "正常の範囲（31点未満）")
  ];
  if(r.severity) lines.push("重症度の目安：" + r.severity + "認知症の可能性");
  lines.push("", "■ 3点以上がついた項目");
  var f = ITEMS.filter(function(it){ return (state.answers[it.n]||0) >= 3; });
  if(f.length){
    f.forEach(function(it){
      lines.push("・問" + it.n + " " + it.domain + "：" + it.q + " → " + state.answers[it.n] + "点"
        + (state.memos[it.n] ? "（" + state.memos[it.n] + "）" : ""));
    });
  } else {
    lines.push("・なし");
  }
  lines.push("", "※これは診断ではありません。確定診断には専門医の受診が必要です。");
  var txt = lines.join("\n");
  var done = function(){
    var b = document.getElementById("copy");
    if(!b) return;
    var o = b.textContent; b.textContent = "コピーしました";
    setTimeout(function(){ b.textContent = o; }, 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt, done); });
  } else { fallbackCopy(txt, done); }
}

function tip(msg){
  var el = document.getElementById("tip");
  if(!el) return;
  el.textContent = msg;
  el.style.display = "block";
}

function fallbackCopy(txt, done){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); }
  catch(err){ tip("コピーできませんでした。お手数ですが、画面を選択してコピーしてください。"); }
  document.body.removeChild(ta);
}

render();
})();
</script>
